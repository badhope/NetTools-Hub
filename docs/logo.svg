<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="CodeLearning · 码上">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#121A2A"/>
    </linearGradient>
    <linearGradient id="cl-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00FF9C"/>
    </linearGradient>
    <filter id="cl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="cl-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00E5FF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#cl-bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#cl-grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.5" fill="none" stroke="#00E5FF" stroke-opacity="0.18" stroke-width="1.5"/>

  <g transform="translate(44 55) scale(1.75)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cl-glow)">
    <path d="M41 32 L27 54 L41 76" stroke="#00E5FF" stroke-width="8"/>
    <path d="M67 32 L81 54 L67 76" stroke="#00E5FF" stroke-width="8"/>
    <path d="M40 74 L40 64 L51 64 L51 54 L62 54 L62 44" stroke="#00FF9C" stroke-width="8"/>
  </g>

  <text x="250" y="139" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-1.5" fill="#F9FAFB">Code<tspan fill="url(#cl-sweep)">Learning</tspan></text>
  <text x="253" y="197" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="29" font-weight="500" letter-spacing="3.5" fill="#93A3B8">码上 · 离线编程学习终端</text>

  <rect x="253" y="230" width="64" height="3.5" rx="1.75" fill="#00E5FF"/>
  <text x="333" y="237" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="17" letter-spacing="2.6" fill="#00E5FF" opacity="0.62">OFFLINE FIRST · 6 LANGUAGES</text>
</svg>
