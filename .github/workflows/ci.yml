name: CI

# 桌面端（Python 引擎 / 内容 / web 同源）+ Android 构建 + release 打包。
# 全部 job 必须在 main 上全绿；任何失败都视为阻断。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run_release:
        description: '仅演练 release 打包（不创建 Release）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 引擎与内容校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node.js 22（JS 课程判题依赖 node）
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装 CI 依赖（workflow 静态校验用 PyYAML）
        run: python -m pip install -r requirements-ci.txt

      - name: 版本探针
        run: |
          python --version
          node --version
          python -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: 全量单元测试（unittest discover）
        env:
          REQUIRE_NODE: "1"
          REQUIRE_YAML: "1"
        run: python -m unittest discover -s tests -v

      - name: 课程内容校验（全部讲 / 8 挑战 / all judge cases）
        run: python tests/validate_content.py

      - name: Pages 资产同步（catalog / 课程包 / 网页端副本，必须可复现）
        run: |
          python tools/sync_pages_assets.py
          git diff --exit-code -- docs/catalog.json docs/content_packs docs/web

      - name: 页面链接检查（docs / web 相对链接与锚点）
        run: python tools/check_links.py

      - name: 网页端语法门禁（node --check）
        run: |
          node --check web/app.js
          node --check web/data.js
          node --check web/engine.js

      - name: web 数据与引擎同源校验（含生成产物可复现）
        run: |
          python web/gen_data.py
          git diff --exit-code -- web/data.js web/engine.js

  android-build:
    name: Android 构建（assembleDebug + lint）
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # APK 探针要解析 Chaquopy 产出的 3.13 pyc，必须用同主次版本的 Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 接受 Android SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint（阻断级，0 error 才通过）
        run: ./gradlew :app:lintDebug --no-daemon

      - name: JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 无签名也跑 release 变体：验证 R8 混淆 / 资源压缩 / proguard 规则在
      # main 上就被覆盖，而不是等到打 tag 才发现
      - name: Build Release APK（未签名，验证 R8 链路）
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Lint Release（阻断）
        run: ./gradlew :app:lintRelease --no-daemon

      - name: 构建产物探针（APK 内 runner.py 与 assets 完整性）
        run: python tests/ci_apk_probe.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  mirror-sync:
    name: 同步镜像仓（仅主仓）
    runs-on: ubuntu-latest
    needs: android-build
    if: github.repository == 'badhope/mashang' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 推送到 GitCode / Gitee / 两个 GitHub 镜像
        env:
          MIRROR_GITCODE_TOKEN: ${{ secrets.MIRROR_GITCODE_TOKEN }}
          MIRROR_GITEE_TOKEN: ${{ secrets.MIRROR_GITEE_TOKEN }}
          MIRROR_GH_X33834_TOKEN: ${{ secrets.MIRROR_GH_X33834_TOKEN }}
          MIRROR_GH_MORNINGSTAR_TOKEN: ${{ secrets.MIRROR_GH_MORNINGSTAR_TOKEN }}
        run: bash scripts/ci/sync_mirrors.sh

  release:
    name: 发布 Release（仅 tag）
    runs-on: ubuntu-latest
    needs: android-build
    # tag 推送自动发布；手动触发时可用 dry_run_release 演练同一条打包/验签链路
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run_release
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 从仓库 Secrets 还原签名密钥库（4 个 secret 缺一不可，缺失则此步失败，
      # 避免悄悄产出未签名包被当成正式版发布）
      - name: 校验 tag 与 versionName/versionCode
        run: python scripts/ci/check_release_version.py

      # 凭据只在本步 env 内可见，不写入 $GITHUB_ENV —— 否则后续所有 step
      # （含第三方 action）都能读到签名口令。
      - name: 还原 release 签名密钥库
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?secrets.ANDROID_KEYSTORE_BASE64 未配置}"
          : "${KEYSTORE_PASSWORD:?secrets.ANDROID_KEYSTORE_PASSWORD 未配置}"
          : "${KEY_ALIAS:?secrets.ANDROID_KEY_ALIAS 未配置}"
          : "${KEY_PASSWORD:?secrets.ANDROID_KEY_PASSWORD 未配置}"
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 校验签名（apksigner + 非 debug 证书）
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          # 必须不是 debug 证书（防止误用 debug keystore 当正式版发布）。
          # 不硬编码 CN 文案：证书主体可能是历史品牌名（CN=Mashang），
          # 品牌升级为 CodeLearning 后不应因此阻断发布。
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "错误：APK 使用了 debug 证书，拒绝发布"
            exit 1
          fi
          echo "$CERTS"

      - name: 归档并重命名为 mashang-<tag>.apk
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" "mashang-${GITHUB_REF_NAME}.apk"
          python tests/ci_apk_probe.py "mashang-${GITHUB_REF_NAME}.apk" --require-release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run_release
        uses: softprops/action-gh-release@v3
        with:
          files: mashang-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 演练模式归档 APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-apk
          path: mashang-*.apk
          retention-days: 7
